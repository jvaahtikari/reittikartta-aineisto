name: MML-rajapinnan koeajo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/mml_probe.yml"]

permissions:
  contents: write

jobs:
  koe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Asenna laspy
        run: sudo python3 -m pip install --break-system-packages laspy lazrs numpy
      - name: Aja koe
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
        run: python3 probe/mml_probe.py
      - name: Julkaise yhteenveto haaraan ajoloki-probe
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ajoloki-probe
          git rm -rf --quiet . || true
          cp probe_ulos/probe.md probe_ulos/probe.json . 2>/dev/null || true
          git add probe.md probe.json
          git commit -m "MML-koeajon yhteenveto" --quiet
          git push --force origin HEAD:ajoloki-probe
