name: Ruovikkoaineiston koeajo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe_ruovikko/**", ".github/workflows/ruovikko_probe.yml"]

permissions:
  contents: write

jobs:
  koe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Selvitä SYKEn Corine 2018 -latausosoitteiden saatavuus
        shell: bash
        run: |
          mkdir -p ulos_koe
          {
            echo "# SYKE Corine 2018 -koeajo $(date -u +%FT%TZ)"
            echo
            for u in \
              "https://wwwd3.ymparisto.fi/d3/Static_rs/spesific/clc2018_fi20m.zip" \
              "https://wwwd3.ymparisto.fi/d3/Static_rs/spesific/clc2018eu25ha.zip" \
              "https://paikkatiedot.ymparisto.fi/geoserver/inspire_lc/wfs?service=WFS&request=GetCapabilities" \
              "https://ckan.ymparisto.fi/en/dataset/corine-maanpeite-2018"; do
              echo "## HEAD $u"
              echo '```'
              curl -sS -I -L -m 60 "$u" 2>&1 | head -20 || true
              echo '```'
            done
          } > ulos_koe/ruovikko.md 2>&1
          cd ulos_koe
          curl -sS -L -m 280 -o clc.zip "https://wwwd3.ymparisto.fi/d3/Static_rs/spesific/clc2018_fi20m.zip" >> ruovikko.md 2>&1 || echo "lataus epäonnistui: $?" >> ruovikko.md
          if [ -f clc.zip ]; then
            { echo; echo "## zip"; ls -l clc.zip; unzip -l clc.zip | head -40; } >> ruovikko.md 2>&1 || true
          fi
      - name: Luokkataulukko ja rasterin tiedot
        shell: bash
        run: |
          cd ulos_koe
          unzip -o -q clc.zip Clc2018_FI20m.tif.vat.dbf Clc2018_FI20m.tif.xml Clc2018_FI20m.tif.aux.xml Clc2018_FI20m.tfw || echo "unzip epäonnistui" >> ruovikko.md
          python3 - >> ruovikko.md 2>&1 <<'PY' || true
          import struct
          d = open("Clc2018_FI20m.tif.vat.dbf", "rb").read()
          n, hl, rl = struct.unpack("<xxxxIHH", d[:12])
          kentat = []
          o = 32
          while d[o] != 0x0D:
              nimi = d[o:o+11].split(b"\x00")[0].decode(); pit = d[o+16]
              kentat.append((nimi, pit)); o += 32
          print("\n## vat.dbf: %d riviä, kentät %s" % (n, kentat))
          print("```")
          for i in range(n):
              r = d[hl + i*rl: hl + (i+1)*rl]; p = 1; rivi = []
              for nimi, pit in kentat:
                  rivi.append(r[p:p+pit].decode("latin-1").strip()); p += pit
              print(" | ".join(rivi))
          print("```")
          PY
          { echo; echo "## xml"; echo '```'; head -c 3000 Clc2018_FI20m.tif.xml; echo; echo '```'
            echo "## aux.xml"; echo '```'; head -c 1500 Clc2018_FI20m.tif.aux.xml; echo; echo '```'
            echo "## tfw"; cat Clc2018_FI20m.tfw; } >> ruovikko.md 2>&1
      - name: Julkaise yhteenveto haaraan ajoloki-ruovikko
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ajoloki-ruovikko
          git rm -rf --quiet . || true
          cp ulos_koe/ruovikko.md . 2>/dev/null || true
          git add ruovikko.md
          git commit -m "Ruovikkokoeajon yhteenveto" --quiet
          git push --force origin HEAD:ajoloki-ruovikko
