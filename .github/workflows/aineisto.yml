name: Rakenna Näsijärven aineistopaketti

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", ".github/workflows/aineisto.yml"]
  schedule:
    - cron: "17 3 1 * *"   # kuukauden ensimmäinen päivä klo 03.17 UTC

permissions:
  contents: write      # vain ajolokin työntämiseen haaraan ajoloki (git push --force)
  pages: write
  id-token: write

concurrency:
  group: aineisto
  cancel-in-progress: true       # uusi ajo korvaa kesken olevan (tarvitaan, jos asennusaskel jää jumiin eikä ajoa voi peruuttaa muuten)

jobs:
  rakenna:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Ajon alkuhetki
        id: alku
        run: echo "s=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Asenna työkalut, apt-pakettilistat
        timeout-minutes: 6
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update

      - name: Asenna työkalut, apt-paketit
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            gdal-bin python3-gdal python3-numpy python3-scipy python3-pil python3-pyproj python3-shapely python3-pip fonts-dejavu-core tippecanoe

      - name: Asenna työkalut, pip-paketit
        timeout-minutes: 6
        run: |
          sudo python3 -m pip install --break-system-packages pmtiles mapbox-vector-tile jsonschema laspy lazrs
          tippecanoe --version
          gdalinfo --version

      - name: Laserruutujen välimuisti
        uses: actions/cache@v4
        with:
          path: tyo/laser/raaka/laz
          key: laser-laz-${{ hashFiles('laser.py') }}
          restore-keys: laser-laz-

      - name: Lataa, rakenna ja tarkista (python3 ajaa.py)
        shell: bash
        run: |
          mkdir -p tyo
          python3 ajaa.py 2>&1 | tee tyo/ajaa.log

      # MML:n laserkeilaus tiedostopalvelun OGC API Processes -rajapinnasta. Avain on vain tämän askeleen ympäristömuuttuja (GitHubin salaisuus),
      # eikä sitä tulosteta eikä kirjoiteta mihinkään. Ilman avainta laser.py käyttää Paitulin vuoden 2008 keilausta.
      - name: Laserkeilaus rantavyöhykkeeltä (python3 laser.py)
        shell: bash
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}
        run: python3 laser.py 2>&1 | tee tyo/laser.log

      # Vaihe 1d: veneiden paikat MML:n avoimesta ortokuvasta (Paituli). Ortokuvalehdet ovat 6 x 6 km:n JP2-tiedostoja (noin 100 Mt), joten ne
      # välimuistitetaan kuten laz-tiedostot. Hylättyjen kevätkuvien muisti (hylatyt.json) on samassa hakemistossa.
      - name: Ortokuvien välimuisti
        uses: actions/cache@v4
        with:
          path: tyo/orto/jp2
          key: orto-jp2-${{ hashFiles('veneet.py') }}
          restore-keys: orto-jp2-

      - name: Veneiden tunnistus ortokuvasta (python3 veneet.py)
        shell: bash
        run: python3 veneet.py 2>&1 | tee tyo/veneet.log

      # Paketin tarkistus uudelleen laser- ja venevaiheen jälkeen, koska laser.py ja veneet.py lisäävät aineisto.json-tiedostoon lähteen ja tiedostot
      - name: Paketin tarkistus laser- ja venevaiheen jälkeen (python3 tarkista.py)
        shell: bash
        run: python3 tarkista.py --vaadi-veneet 2>&1 | tee tyo/tarkista_laserin_jalkeen.log

      - name: Maaston korkeustarkistus (python3 maastotarkistus.py)
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 maastotarkistus.py 2>&1 | tee tyo/maastotarkistus.log

      - name: Levytila ajon jälkeen
        if: always()
        run: df -h . && du -sh tyo ulos || true

      - name: Kirjoita ajon yhteenveto ja julkaise haaraan ajoloki
        if: always()
        shell: bash
        env:
          MML_API_KEY: ${{ secrets.MML_API_KEY }}      # vain yhteenvedon puhdistukseen, ei tulosteta
          GH_TOKEN: ${{ github.token }}
          AJO_ALKU: ${{ steps.alku.outputs.s }}
          AJO_TILA: ${{ job.status }}
        run: |
          set -e
          d="$(mktemp -d)"
          python3 ajoloki.py "$d/ajoloki/viimeisin.md"
          if [ -n "$MML_API_KEY" ] && grep -qF -- "$MML_API_KEY" "$d/ajoloki/viimeisin.md"; then
            echo "Yhteenveto sisältäisi avaimen, sitä ei julkaista."
            exit 1
          fi
          cp "$d/ajoloki/viimeisin.md" ulos_ajoloki_kopio.md || true
          cd "$d"
          git init -q -b ajoloki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ajoloki/viimeisin.md
          git commit -q -m "Ajon ${GITHUB_RUN_ID} yhteenveto"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          otsake="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${otsake}" push --force origin ajoloki

      - name: Tallenna lokit ja tarkistustulos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokit
          path: |
            tyo/lataus_loki.json
            tyo/*.log
            tyo/laser/loki.json
            tyo/veneet/loki.json
            tyo/laser/ruudut.json
            tyo/maastotarkistus.json
            tyo/puusto_tilasto.json
            ulos_ajoloki_kopio.md
            tyo/kerrosmaarat.json
            tyo/tienimet_gdal.log
            ulos/tarkistus.json
            ulos/ajoaika.json
            ulos/tarkistus_1b.json
            ulos/tarkistuskuvat/
          retention-days: 30
          if-no-files-found: ignore

      - name: Valmistele Pages-paketti
        run: |
          rm -f ulos/ajoaika.json ulos/tarkistus_1b.json
          rm -rf ulos/tarkistuskuvat
          ls -la ulos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ulos

  julkaise:
    needs: rakenna
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - id: julkaisu
        uses: actions/deploy-pages@v4
